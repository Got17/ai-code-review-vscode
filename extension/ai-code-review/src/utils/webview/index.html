<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>WS Code Review</title>

	<!-- CSP setup -->
	<meta http-equiv="Content-Security-Policy" 
		content="default-src 'none'; 
				 style-src {{cspSource}} 'unsafe-inline'; 
				 script-src 'nonce-{{nonce}}' {{cspSource}};">

	<!-- DiffJs library -->
	<script src="{{diffJsSrc}}" nonce="{{nonce}}"></script>

	<!-- MarkedJs library -->
	<script src="{{markedJsSrc}}" nonce="{{nonce}}"></script>

	<!-- highlight.js core -->
	<link rel="stylesheet" href="{{githubDarkStyle}}"/>
	<script src="{{highlightJsSrc}}" nonce="{{nonce}}"></script>

	<!-- Load F# language -->
	<script src="{{fSharpSrc}}" nonce="{{nonce}}"></script>

	<!-- Local stylesheet -->
	<link href="{{styleUri}}" rel="stylesheet" />
</head>
<body>
	<!-- Dynamic content injected from webviewHtml function -->
	<div id="webview-body-content">
		<!-- TOP BAR -->
		<div id="top-bar">
			<div class="file-info">📄 File: {{fileName}}</div>

			<div class="model-area">
				<select id="model-select" class="model-select" title="Pick Ollama model">
				<!-- populated at runtime -->
				</select>

				<button id="refresh-button"
					class="icon-btn"
					title="Refresh (re-run Show Suggestion)"
					aria-label="Refresh"
					disabled>⟳</button>

				<button id="stop-button"
					class="icon-btn danger"
					title="Stop AI"
					aria-label="Stop"
					disabled>⏹</button>
			</div>
		</div>
		
		<div id="streaming-response-area">
			<div class="loading-text">🤖 AI is generating suggestion, please wait... (response will stream here)</div>
		</div>

		<div class="buttons">
			<button title="Accept AI Suggestion" id="accept-button" disabled>✅ Accept Suggestion</button>
			<button title="Reject AI Suggestion" id="reject-button" disabled>❌ Reject Suggestion</button>
		</div>
	</div>

	<button	id="jump-to-latest" title="Scroll to newest">
		<svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16px" height="16px" viewBox="0 0 24 24">
			<path fill-rule="evenodd" clip-rule="evenodd" d="M12 3C12.5523 3 13 3.44772 13 4V17.5858L18.2929 12.2929C18.6834 11.9024 19.3166 11.9024 19.7071 12.2929C20.0976 12.6834 20.0976 13.3166 19.7071 13.7071L12.7071 20.7071C12.3166 21.0976 11.6834 21.0976 11.2929 20.7071L4.29289 13.7071C3.90237 13.3166 3.90237 12.6834 4.29289 12.2929C4.68342 11.9024 5.31658 11.9024 5.70711 12.2929L11 17.5858V4C11 3.44772 11.4477 3 12 3Z" fill="currentColor"></path>
		</svg>
	</button>

	<!-- Local script -->
	<script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
