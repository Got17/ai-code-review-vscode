<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AI Code Review</title>

	<!-- CSP setup -->
	<meta http-equiv="Content-Security-Policy" 
		content="default-src 'none'; 
				 style-src {{cspSource}} 'unsafe-inline'; 
				 script-src 'nonce-{{nonce}}' {{cspSource}};">

	<!-- DiffJs library -->
	<script src="{{diffJsSrc}}" nonce="{{nonce}}"></script>

	<!-- MarkedJs library -->
	<script src="{{markedJsSrc}}" nonce="{{nonce}}"></script>

	<!-- highlight.js core -->
	<link rel="stylesheet" href="{{githubDarkStyle}}"/>
	<script src="{{highlightJsSrc}}" nonce="{{nonce}}"></script>

	<!-- Load F# language -->
	<script src="{{fSharpSrc}}" nonce="{{nonce}}"></script>

	<!-- Local stylesheet -->
	<link href="{{styleUri}}" rel="stylesheet" />
</head>
<body>
	<!-- Dynamic content injected from webviewHtml function -->
	<div id="webview-body-content">
		<div class="file-info">📄 File: {{fileName}}</div>
		<hr>
		
		<div id="streaming-response-area">
			<div class="loading-text">🤖 AI is generating suggestion, please wait... (response will stream here)</div>
		</div>

		<div class="buttons">
			<button title="Accept AI Suggestion" id="accept-button" disabled>✅ Accept Suggestion</button>
			<button title="Reject AI Suggestion" id="reject-button" disabled>❌ Reject Suggestion</button>
		</div>
	</div>

	<!-- Local script -->
	<script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
